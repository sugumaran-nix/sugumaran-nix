<svg viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg" width="100%">
  <style>
    .ft {
      font-family: 'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 2;
      fill: #7D8590;
    }
    @media (max-width: 480px) {
      .ft { font-size: 26px; letter-spacing: 1; }
    }
    @media (max-width: 360px) {
      .ft { font-size: 30px; letter-spacing: 0.5; }
    }
    .ln { animation: expand 0.6s ease 0.1s forwards;
          transform-box:fill-box; transform-origin:50% 50%;
          transform:scaleX(0); opacity:0; }
    .dot { animation: pulse 1.6s ease-in-out 0.7s infinite; }
    .leaf { opacity:0.12; }
    @keyframes expand {
      from { opacity:0; transform:scaleX(0); }
      to   { opacity:1; transform:scaleX(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity:1; }
      50%      { opacity:0.35; }
    }
  </style>

  <rect width="900" height="80" fill="#0D1117"/>
  <g class="leaf" fill="#B22222">
    <path d="M28 30 C 16 38, 16 54, 28 62 C 40 54, 40 38, 28 30 Z"/>
  </g>
  <path class="ln" d="M60 20 Q 450 14, 840 20" stroke="#B22222" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>

  <text class="ft" x="450" y="52" text-anchor="middle">
    crafted by sugumaran<tspan class="dot" dx="14" dy="0" fill="#F5F5F5" font-size="10">●</tspan><tspan dx="14" dy="0">© 2026</tspan>
  </text>
</svg>
