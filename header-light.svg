<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" width="100%">
  <style>
    .role {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      opacity: 0;
    }
    @keyframes r1 {
      0%    { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      5%    { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      20%   { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      25%   { opacity:0; transform:perspective(600px) rotateX(-90deg); filter:blur(6px); }
      25.1% { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      100%  { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
    }
    @keyframes r2 {
      0%    { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      25%   { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      30%   { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      45%   { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      50%   { opacity:0; transform:perspective(600px) rotateX(-90deg); filter:blur(6px); }
      50.1% { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      100%  { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
    }
    @keyframes r3 {
      0%    { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      50%   { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      55%   { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      70%   { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      75%   { opacity:0; transform:perspective(600px) rotateX(-90deg); filter:blur(6px); }
      75.1% { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      100%  { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
    }
    @keyframes r4 {
      0%   { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      75%  { opacity:0; transform:perspective(600px) rotateX(90deg);  filter:blur(6px); }
      80%  { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      95%  { opacity:1; transform:perspective(600px) rotateX(0deg);   filter:blur(0px); }
      100% { opacity:0; transform:perspective(600px) rotateX(-90deg); filter:blur(6px); }
    }
    .r1 { animation: r1 12s cubic-bezier(0.2,0.65,0.3,0.9) infinite; }
    .r2 { animation: r2 12s cubic-bezier(0.2,0.65,0.3,0.9) infinite; }
    .r3 { animation: r3 12s cubic-bezier(0.2,0.65,0.3,0.9) infinite; }
    .r4 { animation: r4 12s cubic-bezier(0.2,0.65,0.3,0.9) infinite; }
    .hdg { animation: fadeDown 0.7s ease forwards; }
    .tch { animation: fadeUp 0.7s ease 0.35s forwards; opacity:0; }
    .div { animation: expand 0.6s ease 0.15s forwards;
           transform-box:fill-box; transform-origin:50% 50%;
           transform:scaleX(0); opacity:0; }
    .leaf { animation: driftIn 1.4s ease 0.1s forwards; opacity:0; }
    @keyframes fadeDown {
      from { opacity:0; transform:translateY(-14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes expand {
      from { opacity:0; transform:scaleX(0); }
      to   { opacity:1; transform:scaleX(1); }
    }
    @keyframes driftIn {
      from { opacity:0; transform:translateY(-6px); }
      to   { opacity:0.16; transform:translateY(0); }
    }
  </style>

  <rect width="900" height="300" fill="#F8F4E3"/>

  <!-- Subtle leaf-silhouette motifs, corner-positioned, low opacity -->
  <g class="leaf" fill="#4CAF50">
    <path d="M50 40 C 20 60, 20 100, 50 130 C 80 100, 80 60, 50 40 Z"/>
    <path d="M50 130 L50 150" stroke="#4CAF50" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" fill="#F59E0B" opacity="0.16">
    <path d="M850 170 C 878 190, 878 228, 850 256 C 822 228, 822 190, 850 170 Z"/>
    <path d="M850 256 L850 275" stroke="#F59E0B" stroke-width="2" fill="none"/>
  </g>

  <!-- Heading -->
  <text class="hdg"
    x="450" y="105"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="60" font-weight="700" letter-spacing="-0.5"
    fill="#1F2937">Hello, I'm Sugumaran!</text>

  <!-- Ink-brush style divider -->
  <path class="div" d="M80 132 Q 265 126, 450 132 T 820 132"
    stroke="#4CAF50" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Roles -->
  <text class="role r1"
    x="450" y="188"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="24" font-weight="500" letter-spacing="5"
    fill="#4CAF50">MCA GRADUATE  ·  2026</text>

  <text class="role r2"
    x="450" y="188"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="24" font-weight="500" letter-spacing="5"
    fill="#1F2937">FULL STACK DEVELOPER</text>

  <text class="role r3"
    x="450" y="188"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="24" font-weight="500" letter-spacing="5"
    fill="#F59E0B">AI / ML ENTHUSIAST</text>

  <text class="role r4"
    x="450" y="188"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="24" font-weight="500" letter-spacing="5"
    fill="#4CAF50">OPEN TO WORK</text>

  <!-- Tech line -->
  <text class="tch"
    x="450" y="252"
    text-anchor="middle"
    font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif"
    font-size="18" font-weight="700" letter-spacing="2"
    fill="#3a3a3a">Python  ·  Flask  ·  FastAPI  ·  React  ·  Next.js</text>
</svg>
