name: generate pacman contribution graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate pacman contribution graph SVGs (light + dark)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'
          hide_month_labels: 'false'
          # Classic arcade Pac-Man palette
          background_color: '#000000'
          pacman_color: '#FFD700'
          dot_color: '#FFFFFF'
          food_color: '#FFD700'
          color_empty: '#1a1a2a'
          color_1: '#1a3a6b'
          color_2: '#1E3A8A'
          color_3: '#2563EB'
          color_4: '#F97316'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
