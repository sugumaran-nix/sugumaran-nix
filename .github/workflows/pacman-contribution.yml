name: generate pacman contribution graph

on:
  schedule: # Run automatically every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering
  push: # Runs on every push to the main branch
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate pacman contribution graph SVGs (light + dark)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # Only the Pac-Man game — replaces the old snake graph
          games: 'pacman'
          hide_month_labels: 'false'

      # Push the generated SVGs to the output branch.
      # The action outputs both pacman-contribution-graph.svg (light)
      # and pacman-contribution-graph-dark.svg (dark), which the README
      # switches between automatically via <picture prefers-color-scheme>.
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
